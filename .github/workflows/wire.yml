name: Build The Wire
# Refreshes at 8 AM, 4 PM and midnight US Eastern, every day.
# GitHub schedules run in UTC, so both daylight-saving and standard-time slots are listed;
# the "time check" step lets only the run that lands on an Eastern 8/16/0 hour through.
on:
  schedule:
    - cron: "0 12,13,20,21,4,5 * * *"
  workflow_dispatch:        # "Run workflow" button = refresh now
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: wire, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Time check (Eastern 8 AM / 4 PM / midnight)
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ] || [ "$H" = "16" ] || [ "$H" = "00" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Eastern hour is $H; skipping this slot."; echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with: {python-version: "3.12"}
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.go == 'true'
        run: python run.py --out site/index.html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
    outputs:
      go: ${{ steps.gate.outputs.go }}
  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
