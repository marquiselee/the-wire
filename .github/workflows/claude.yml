name: Claude (@claude in issues and PRs)
# Lets you request site changes from GitHub on your phone: open an issue that mentions @claude,
# Claude opens a pull request, you merge it, and the next scheduled build publishes it.
# Requires: the Claude GitHub app installed on this repo + the ANTHROPIC_API_KEY secret.
on:
  issues: {types: [opened]}
  issue_comment: {types: [created]}
  pull_request_review_comment: {types: [created]}
jobs:
  claude:
    # only react to @claude from the repo owner (you), so strangers can't spend your API credits
    if: >
      github.actor == github.repository_owner && (
      contains(github.event.comment.body || '', '@claude') ||
      contains(github.event.issue.body || '', '@claude'))
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write, issues: write, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
